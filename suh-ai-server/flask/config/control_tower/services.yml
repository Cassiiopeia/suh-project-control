# 관제소 등록 파일: 서비스·프로젝트·알림·디스코드 정책의 단일 원본 (시크릿 없음)
# ${NAME} = 기동 시 환경변수로 치환 (예: NAS_LAN_HOST = NAS 내부 IP)
# 서비스 status: active 감시·알림·공개 / paused 감시만 / retired 감시 안 함
# 외부 점검 expect 비어 있으면 '응답이 오고 502·503·504·520~530(Cloudflare 엣지 오류)이 아니면 정상'
# 외부 점검(Worker) 상한 45개 (Cloudflare 무료 서브요청 한도)

alert:
  failures_to_down: 3    # 연속 실패 3회 > down 알림
  successes_to_up: 2     # 연속 성공 2회 > 복구 알림
  slow_milliseconds: 5000
  reminder_hours: 6      # down 지속 중 재알림 간격
  digest_hour_kst: 9     # 일일 요약 시각 (KST)
  parent_recovery_grace_minutes: 10  # 부모 복구 후 자식 알림 보류 (분), 이후 계속 down은 묶음 1건
  bulk_alert_threshold: 5  # 한 번에 개별 down(또는 복구) 알림 5건 이상 > #관제-긴급 1건으로 묶음

discord:
  roles:                          # 프로젝트마다 만들어지는 역할 이름 규칙
    member: "{project}"           # 온보딩에서 고름
    dev: "{project}-dev"          # 관리자가 직접 줌
  admin_role_name: 관리자
  channel_visibility:             # 채널 종류 > 볼 수 있는 역할 (admin은 항상 포함)
    status: [member, dev]
    deploy: [member, dev]
    error: [dev]
    report: [dev]
  global_channels:
    notice: {visible_to: [everyone]}
    alert: {visible_to: [admin]}    # #관제-긴급
    digest: {visible_to: [admin]}   # #관제-요약

infrastructure:                   # 다른 서비스의 부모 (depends_on 대상)
  - id: nas
    name: 시놀로지 NAS
    checks:
      internal: {tcp: "${NAS_LAN_HOST}:5001"}   # DSM 포트
  - id: windows
    name: Windows SUH AI 서버
    # 별도 점검 없음: 관제소 자신 (심박으로 Worker가 판정)
  - id: home-network
    name: 집 인터넷
    # 별도 점검 없음: Worker가 관제소 심박 끊김으로 판정

