name: SUH-AI-PROJECT-CONTROL

on:
  push:
    branches: [ "main", "deploy" ]
  workflow_dispatch:

jobs:
  deploy-to-windows:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nginx 설정 파일에 API 키 주입
        run: |
          echo "[INFO] API key list injection started..."

          # API 키 리스트 파싱 (쉼표 구분)
          IFS=',' read -ra KEYS <<< "${{ secrets.OLLAMA_API_KEY_LIST }}"

          # Nginx map 형식으로 변환
          API_KEY_MAP=""
          for key in "${KEYS[@]}"; do
            key=$(echo "$key" | xargs)  # 앞뒤 공백 제거
            if [ -n "$key" ]; then
              API_KEY_MAP="${API_KEY_MAP}\"${key}\" 1;\n        "
            fi
          done

          # 플레이스홀더를 실제 키로 치환
          sed -i "s|{{OLLAMA_API_KEY_LIST}}|${API_KEY_MAP}|g" suh-ai-server/config/nginx.conf

          echo "[SUCCESS] API key injection completed (${#KEYS[@]} keys)"

          # 검증 (민감 정보 마스킹)
          echo "[INFO] Configuration preview:"
          grep -A 5 "map \$http_x_api_key" suh-ai-server/config/nginx.conf | sed 's/"[^"]*"/"****"/g' || echo "[WARN] Preview failed (may be normal)"

      - name: suh-ai-server 폴더 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 2023
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "suh-ai-server"
          target: "C:/AI/"
          rm: false

      - name: 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 2023
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\AI\suh-ai-server\scripts\deploy.ps1" -CommitSha "${{ github.sha }}"

      - name: Nginx 설정 적용 및 재시작
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 2023
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            powershell -Command "Write-Host '[INFO] Searching for Nginx installation...'; `$nginxPath = Get-ChildItem 'C:\tools' -Directory -Filter 'nginx-*' -ErrorAction SilentlyContinue | Where-Object { Test-Path \"`$(`$_.FullName)\nginx.exe\" } | Select-Object -First 1 -ExpandProperty FullName; if (-not `$nginxPath) { Write-Host '[ERROR] Nginx not found'; exit 1 }; Write-Host \"[SUCCESS] Nginx path: `$nginxPath\"; `$timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'; `$confPath = Join-Path `$nginxPath 'conf\nginx.conf'; `$backupPath = \"`$confPath.backup.`$timestamp\"; if (Test-Path `$confPath) { Copy-Item `$confPath `$backupPath -ErrorAction SilentlyContinue; Write-Host \"[INFO] Backup created: `$backupPath\" }; Copy-Item 'C:\AI\suh-ai-server\config\nginx.conf' `$confPath -Force; Write-Host '[SUCCESS] Configuration file deployed'; `$nginxExe = Join-Path `$nginxPath 'nginx.exe'; Write-Host '[INFO] Validating Nginx configuration...'; `$testOutput = & `$nginxExe -t 2>&1; Write-Host `$testOutput; if (`$LASTEXITCODE -ne 0) { Write-Host '[ERROR] Configuration validation failed - rolling back...'; if (Test-Path `$backupPath) { Copy-Item `$backupPath `$confPath -Force; Write-Host '[SUCCESS] Rolled back to previous configuration' }; exit 1 }; Write-Host '[SUCCESS] Configuration validation passed'; `$nginxProcess = Get-Process nginx -ErrorAction SilentlyContinue; if (`$nginxProcess) { Write-Host '[INFO] Reloading Nginx...'; & `$nginxExe -s reload; if (`$LASTEXITCODE -eq 0) { Write-Host '[SUCCESS] Nginx reloaded' } else { Write-Host '[WARN] Reload failed - attempting restart...'; Stop-Process -Name nginx -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; Start-Process -FilePath `$nginxExe -WorkingDirectory `$nginxPath -WindowStyle Hidden; Write-Host '[SUCCESS] Nginx restarted' } } else { Write-Host '[INFO] Starting Nginx...'; Start-Process -FilePath `$nginxExe -WorkingDirectory `$nginxPath -WindowStyle Hidden; Write-Host '[SUCCESS] Nginx started' }; Write-Host '[SUCCESS] Nginx deployment completed'"
