# Simplified Nginx configuration without Lua dependencies
worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log logs/access.log main;
    
    sendfile on;
    keepalive_timeout 65;
    
    # Upstream for Ollama
    upstream ollama_backend {
        server 127.0.0.1:11434;
    }
    
    # Map to check if IP is local
    map $remote_addr $is_local {
        ~^127\. 1;
        ~^192\.168\. 1;
        ~^10\. 1;
        ~^172\.(1[6-9]|2[0-9]|3[01])\. 1;
        default 0;
    }
    
    server {
        listen 11435;
        server_name _;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, X-API-KEY, Content-Type' always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Authorization, X-API-KEY, Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        # Health check endpoint (no auth)
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"suh-ai-server","timestamp":"$time_iso8601"}';
        }
        
        # Tunnel info endpoint (no auth)
        location = /api/tunnel-info {
            default_type application/json;
            root ../data;
            try_files /tunnel-info.json =404;
        }
        
        # Log listing endpoint
        location = /api/logs {
            # Simple auth check - in production, use proper auth module
            if ($is_local = 0) {
                # For external requests, check for API key presence
                set $auth_check 0;
                if ($http_authorization) {
                    set $auth_check 1;
                }
                if ($http_x_api_key) {
                    set $auth_check 1;
                }
                if ($auth_check = 0) {
                    return 401 '{"error":"Unauthorized - API key required"}';
                }
            }
            
            default_type application/json;
            return 200 '{"message":"Log endpoint active","logs_dir":"logs/","note":"Use /api/logs/{filename} to retrieve specific log"}';
        }
        
        # Specific log file access
        location ~ ^/api/logs/(.+)$ {
            # Simple auth check
            if ($is_local = 0) {
                set $auth_check 0;
                if ($http_authorization) {
                    set $auth_check 1;
                }
                if ($http_x_api_key) {
                    set $auth_check 1;
                }
                if ($auth_check = 0) {
                    return 401 '{"error":"Unauthorized - API key required"}';
                }
            }
            
            default_type text/plain;
            alias logs/$1;
        }
        
        # Ollama API proxy
        location / {
            # Simple auth check for external requests
            if ($is_local = 0) {
                set $auth_check 0;
                if ($http_authorization) {
                    set $auth_check 1;
                }
                if ($http_x_api_key) {
                    set $auth_check 1;
                }
                if ($auth_check = 0) {
                    return 401 '{"error":"Unauthorized - API key required"}';
                }
            }
            
            # Proxy to Ollama
            proxy_pass http://ollama_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for long-running AI requests
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            
            # Buffer settings for large responses
            proxy_buffering off;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
    }
}