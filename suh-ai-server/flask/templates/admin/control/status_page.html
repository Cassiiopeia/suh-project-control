{# 관제소 상태 페이지 탭: 사이트 이름, 공지 문구·수준, 미리보기 링크 #}
<div class="card bg-base-100 shadow border border-base-300">
  <div class="card-body">
    <h2 class="card-title text-base flex items-center gap-2">
      <i data-lucide="globe" class="size-5 text-primary"></i>공개 상태 페이지
      <a id="control-status-page-preview" href="https://status.suhsaechan.kr" target="_blank" rel="noopener noreferrer"
         class="btn btn-ghost btn-xs ml-auto"><i data-lucide="external-link" class="size-4"></i>미리보기</a>
    </h2>
    <p class="text-xs opacity-60">저장하면 다음 점검(60초 안)에 공개 페이지에 반영됩니다. Worker 캐시로 최대 1분 더 걸릴 수 있습니다.</p>
    <form id="control-status-page-form" class="mt-3 space-y-3">
      <label class="block w-full">
        <span class="block text-xs opacity-70 mb-1">사이트 이름 (1~60자)</span>
        <input id="control-status-page-title" type="text" class="input input-sm w-full" required maxlength="60"
               autocomplete="off" placeholder="SUHSAECHAN Status">
      </label>
      <label class="block w-full">
        <span class="block text-xs opacity-70 mb-1">공지 문구 (300자 이내, 비우면 공지 없음)</span>
        <textarea id="control-status-page-notice-text" class="textarea textarea-sm w-full" rows="3" maxlength="300"
                  placeholder="예: 11/8 02:00~03:00 NAS 점검 예정"></textarea>
        <span id="control-status-page-notice-count" class="block text-xs opacity-60 text-right">0 / 300</span>
      </label>
      <label class="block w-full">
        <span class="block text-xs opacity-70 mb-1">공지 수준</span>
        <select id="control-status-page-notice-level" class="select select-sm w-full">
          <option value="info">안내 (info)</option>
          <option value="warning">주의 (warning)</option>
          <option value="critical">긴급 (critical)</option>
        </select>
      </label>
      <div class="flex gap-2">
        <button id="control-status-page-submit" type="submit" class="btn btn-primary btn-sm flex-1">
          <i data-lucide="save" class="size-4"></i>저장
        </button>
        <button id="control-status-page-reset" type="button" class="btn btn-outline btn-sm">
          <i data-lucide="rotate-ccw" class="size-4"></i>기본값으로
        </button>
      </div>
    </form>
  </div>
</div>
