worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # upload limit - default 1m breaks voice cloning multipart uploads with 413
    # (ASCII comment only: non-ASCII here previously merged lines and disabled the directive)
    client_max_body_size 15m;

    # Map hash configuration for long API keys
    map_hash_bucket_size 128;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=python_limit:10m rate=100r/s;
    # Control tower event and app attention push intake (no API key): per-IP 5 req/s
    limit_req_zone $binary_remote_addr zone=control_events:1m rate=5r/s;

    # gbrain public MCP: real client key = CF-Connecting-IP (Cloudflare overwrites it; nginx only sees the NAS proxy IP)
    # Falls back to the connecting address for LAN/direct requests
    map $http_cf_connecting_ip $mcp_client_key {
        default $http_cf_connecting_ip;
        "" $binary_remote_addr;
    }
    # Per real client 10 req/s, plus a per-hop backstop 30 req/s (covers spoofed CF-Connecting-IP on direct-origin hits)
    limit_req_zone $mcp_client_key zone=mcp_client:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=mcp_total:1m rate=30r/s;

    # gbrain public MCP access log: $uri only (no query string), never the Authorization header
    log_format mcp '$remote_addr cf=$http_cf_connecting_ip [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time "$http_user_agent" "$http_x_forwarded_for"';

    # gbrain team brains (#210): /team/<project>/mcp -> that brain's own gbrain HTTP server (127.0.0.1 port per brain)
    # One map file per brain, written by the control tower: C:/AI/gbrain/teams/nginx/<project>.map = "passql 127.0.0.1:3141;"
    # Outside the deploy folder (deploys never drop a brain); a glob with zero files is valid, so nginx -t passes before the first brain
    map $team_brain_project $team_brain_upstream {
        default "";
        include C:/AI/gbrain/teams/nginx/*.map;
    }

    # Bearer token from "Authorization: Bearer <key>" (gbrain Ollama client sends this instead of X-API-Key)
    map $http_authorization $api_key_bearer {
        default "";
        "~*^Bearer\s+(?<bearer_token>\S+)$" $bearer_token;
    }

    # Key to validate: X-API-Key if present, otherwise the bearer token (same key list for both)
    map $http_x_api_key $api_key_candidate {
        default $http_x_api_key;
        "" $api_key_bearer;
    }

    # API Key validation map (GitHub Actions will inject keys here)
    map $api_key_candidate $api_key_valid {
        default 0;
        {{OLLAMA_API_KEY_LIST}}
    }

    # Public endpoints that don't require authentication
    # Keyed on normalized $uri (no query, '..' resolved) so /api/flask/admin/../x cannot skip the key check
    map $uri $is_public_endpoint {
        default 0;
        ~^/health$ 1;                      # Ollama health endpoint
        ~^/api/tags$ 1;                    # Ollama tags endpoint (GET only, no auth required)
        ~^/api/flask/docs/swagger 1;       # Flask Swagger UI
        ~^/docs/swagger 1;                 # Short URL for Swagger UI
        ~^/api/flask/admin 1;              # Admin pages (control API still requires key)
        ~^/api/flask/static/ 1;            # Admin static assets (css/js)
    }

    # Upstream for Ollama
    upstream ollama_backend {
        server 127.0.0.1:11434;
    }

    # Upstream for Python Flask Server
    upstream python_backend {
        server 127.0.0.1:5000;
    }

    # Upstream for gbrain HTTP server (NSSM gbrain-http, 127.0.0.1 only)
    # Proxied paths: /admin (control tower gate cookie) and exact /mcp (gbrain bearer token); OAuth/discovery stay closed
    upstream gbrain_backend {
        server 127.0.0.1:3131;
    }

    server {
        listen 0.0.0.0:11435;
        server_name _;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, X-API-Key, Content-Type' always;

        # Short URL for Swagger UI: /docs/swagger -> /api/flask/docs/swagger (internal rewrite, URL unchanged)
        location /docs/swagger {
            # Authentication decision logic
            set $auth_ok 0;

            # Public endpoints bypass authentication
            if ($is_public_endpoint = 1) {
                set $auth_ok 1;
            }

            # Valid API key grants access
            if ($api_key_valid = 1) {
                set $auth_ok 1;
            }

            # Reject unauthorized requests
            if ($auth_ok = 0) {
                return 401 '{"error":"Unauthorized - Valid X-API-Key header required"}';
            }

            # Rate limiting for Flask (higher limit)
            limit_req zone=python_limit burst=200 nodelay;

            # Internal rewrite to full path (browser URL stays as /docs/swagger)
            rewrite ^/docs/swagger(.*)$ /api/flask/docs/swagger$1 last;
        }

        # Swagger UI routing (MUST be before /api/flask/ to prevent rewrite)
        # This location handles Swagger UI without URL rewriting to maintain browser URL
        location /api/flask/docs/swagger {
            # Authentication decision logic
            set $auth_ok 0;

            # Public endpoints bypass authentication
            if ($is_public_endpoint = 1) {
                set $auth_ok 1;
            }

            # Valid API key grants access
            if ($api_key_valid = 1) {
                set $auth_ok 1;
            }

            # Reject unauthorized requests
            if ($auth_ok = 0) {
                return 401 '{"error":"Unauthorized - Valid X-API-Key header required"}';
            }

            # Rate limiting for Flask (higher limit)
            limit_req zone=python_limit burst=200 nodelay;

            # NO rewrite - pass the full path to Flask to maintain browser URL
            proxy_pass http://python_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for Flask requests (30분 - LLM 처리 시간 고려)
            proxy_read_timeout 1800s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 1800s;
        }

        # Control tower event intake: exempt from X-API-Key check (authenticated by X-Control-Token in Flask)
        # Exact match only, so no other /api/flask/ path is exposed
        location = /api/flask/control/events {
            # JSON events up to 64KB (schema max with Korean fields, ASCII-escaped); dedicated per-IP rate limit
            client_max_body_size 64k;
            limit_req zone=control_events burst=10 nodelay;

            # URL rewrite: /api/flask/control/events -> /control/events
            rewrite ^/api/flask/(.*)$ /$1 break;

            proxy_pass http://python_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/flask;

            proxy_read_timeout 60s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
        }

        # App attention push intake: exempt from X-API-Key check (authenticated by X-Control-Token in Flask)
        # Prefix only for /control/attention/<project>/<source> (admin API /control/app-attention still requires key)
        location ^~ /api/flask/control/attention/ {
            # Attention snapshot up to 64KB; shares the event intake per-IP rate limit
            client_max_body_size 64k;
            limit_req zone=control_events burst=10 nodelay;

            # URL rewrite: /api/flask/control/attention/... -> /control/attention/...
            rewrite ^/api/flask/(.*)$ /$1 break;

            proxy_pass http://python_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/flask;

            proxy_read_timeout 60s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
        }

        # gbrain admin gate check: Flask validates the control tower gate cookie (204 ok / 401)
        location = /_gbrain_admin_gate {
            internal;
            proxy_pass http://python_backend/gbrain/admin-gate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        # gbrain admin denied: no gate cookie (open it from the control tower page)
        location @gbrain_admin_denied {
            default_type text/plain;
            return 401 'gbrain admin: open it from the control tower page /api/flask/admin/gbrain';
        }

        # gbrain one-time login link: never write the nonce to the access log
        location ^~ /admin/auth/ {
            access_log off;
            auth_request /_gbrain_admin_gate;
            error_page 401 = @gbrain_admin_denied;
            limit_req zone=python_limit burst=200 nodelay;

            proxy_pass http://gbrain_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # gbrain sees plain http and omits Secure on its session cookie
            proxy_cookie_flags gbrain_admin secure;
        }

        # gbrain admin dashboard (SPA, cookie-auth API, SSE): control tower gate cookie required
        location ^~ /admin {
            auth_request /_gbrain_admin_gate;
            error_page 401 = @gbrain_admin_denied;
            limit_req zone=python_limit burst=200 nodelay;

            proxy_pass http://gbrain_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cookie_flags gbrain_admin secure;

            # Admin live events are SSE: no buffering, long read timeout
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # gbrain public MCP (stateless streamable HTTP): gbrain validates the per-device token, nginx is the outer filter
        # Exact match only: /mcp/ and /.well-known/* fall through to location / (key required)
        location = /mcp {
            access_log logs/access.log mcp;
            client_max_body_size 4m;

            # Any add_header here also drops the server-level CORS '*' (browser clients stay denied, like gbrain's default)
            add_header WWW-Authenticate 'Bearer realm="gbrain"' always;

            # POST only (GET would only return gbrain's 405; no SSE backchannel)
            if ($request_method != POST) {
                return 405 '{"error":"Method not allowed"}';
            }
            # Bearer token required before reaching gbrain (garbage/revoked tokens are rejected by gbrain with 401)
            if ($http_authorization !~* "^Bearer\s+\S+$") {
                return 401 '{"error":"Unauthorized - Bearer token required"}';
            }

            limit_req zone=mcp_client burst=40 nodelay;
            limit_req zone=mcp_total burst=120 nodelay;
            limit_req_status 429;

            proxy_pass http://gbrain_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Powered-By;

            # Tool replies may stream (SSE) and synthesize can run long
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 10s;
        }

        # gbrain team brain MCP (#210): same outer filter as = /mcp, then the brain's own server validates its own tokens
        # Exact shape only: /team/<project>/mcp (no trailing slash, no /admin, no OAuth/discovery under /team)
        location ~ ^/team/(?<team_brain_project>[a-z][a-z0-9]+)/mcp$ {
            access_log logs/access.log mcp;
            client_max_body_size 4m;

            # Any add_header here also drops the server-level CORS '*' (browser clients stay denied)
            add_header WWW-Authenticate 'Bearer realm="gbrain"' always;

            if ($request_method != POST) {
                return 405 '{"error":"Method not allowed"}';
            }
            if ($http_authorization !~* "^Bearer\s+\S+$") {
                return 401 '{"error":"Unauthorized - Bearer token required"}';
            }
            # Unknown project (no map file): never reaches any gbrain
            if ($team_brain_upstream = "") {
                return 404 '{"error":"Unknown team brain"}';
            }

            limit_req zone=mcp_client burst=40 nodelay;
            limit_req zone=mcp_total burst=120 nodelay;
            limit_req_status 429;

            # Literal 127.0.0.1:<port> from the map (no resolver needed); the brain always sees plain /mcp
            proxy_pass http://$team_brain_upstream/mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Powered-By;

            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 10s;
        }

        # Flask API routing (MUST be before location /)
        location /api/flask/ {
            # Authentication decision logic
            set $auth_ok 0;

            # Public endpoints bypass authentication
            if ($is_public_endpoint = 1) {
                set $auth_ok 1;
            }

            # Valid API key grants access
            if ($api_key_valid = 1) {
                set $auth_ok 1;
            }

            # Reject unauthorized requests
            if ($auth_ok = 0) {
                return 401 '{"error":"Unauthorized - Valid X-API-Key header required"}';
            }

            # Rate limiting for Flask (higher limit)
            limit_req zone=python_limit burst=200 nodelay;

            # URL rewrite: /api/flask/xxx -> /xxx
            rewrite ^/api/flask/(.*)$ /$1 break;

            # Proxy to Python Flask backend
            proxy_pass http://python_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/flask;

            # Timeouts for Flask requests (30분 - LLM 처리 시간 고려)
            proxy_read_timeout 1800s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 1800s;
        }

        # All requests go through authentication check
        location / {
            # Authentication decision logic
            set $auth_ok 0;

            # Public endpoints bypass authentication
            if ($is_public_endpoint = 1) {
                set $auth_ok 1;
            }

            # Valid API key grants access
            if ($api_key_valid = 1) {
                set $auth_ok 1;
            }

            # Reject unauthorized requests
            if ($auth_ok = 0) {
                return 401 '{"error":"Unauthorized - Valid X-API-Key header required"}';
            }

            # Rate limiting for authenticated requests
            limit_req zone=api_limit burst=20 nodelay;

            # Proxy to Ollama backend
            proxy_pass http://ollama_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running AI requests (30분 - LLM 처리 시간 고려)
            proxy_read_timeout 1800s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 1800s;
        }
    }
}
