{# gbrain 팀원 카드 대화창 4개: 팀원 추가·수정, 키 발급, 다시 보기 재확인, 기존 토큰 연결 (gbrain-members.js)
   발급·다시 보기 결과는 토큰 카드 결과 창(token-secret-modal)을 함께 씀 #}
<!-- 팀원 추가·수정 -->
<dialog id="member-form-modal" class="modal">
  <form id="member-form" class="modal-box">
    <h3 class="font-bold text-lg flex items-center gap-2">
      <i data-lucide="user-plus" class="size-5 text-primary"></i><span id="member-form-title">팀원 추가</span>
    </h3>
    <div class="space-y-3 mt-4">
      <label class="flex flex-col gap-1 w-full">
        <span class="text-sm font-medium">영문 id</span>
        <input id="member-handle" type="text" class="input w-full font-mono" required autocomplete="off" spellcheck="false"
               maxlength="40" pattern="[a-z][a-z0-9\-]{1,39}"
               title="소문자로 시작하고 소문자·숫자·하이픈으로 2~40자로 써 주세요 (예: kim-dev)" placeholder="예: kim-dev">
        <span class="text-xs opacity-60">키 이름 앞자리에 쓰여요. 만든 뒤에는 바꿀 수 없어요.</span>
      </label>
      <label class="flex flex-col gap-1 w-full">
        <span class="text-sm font-medium">이름</span>
        <input id="member-display-name" type="text" class="input w-full" required maxlength="100" autocomplete="off">
      </label>
      <label class="flex flex-col gap-1 w-full">
        <span class="text-sm font-medium">연락처 (선택)</span>
        <input id="member-contact" type="text" class="input w-full" maxlength="200" autocomplete="off">
      </label>
      <label class="flex flex-col gap-1 w-full">
        <span class="text-sm font-medium">메모 (선택)</span>
        <textarea id="member-memo" class="textarea w-full" rows="2" maxlength="500"></textarea>
      </label>
      <p id="member-form-error" class="text-sm text-error" hidden></p>
    </div>
    <div class="modal-action">
      <button type="button" class="btn btn-ghost btn-sm" data-close-member-modal="member-form-modal">취소</button>
      <button type="submit" id="member-form-submit" class="btn btn-primary btn-sm">저장</button>
    </div>
  </form>
  <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
</dialog>

<!-- 키 발급: 브레인·이름·권한 (기본 읽기 전용) -->
<dialog id="member-key-issue-modal" class="modal">
  <form id="member-key-issue-form" class="modal-box">
    <h3 class="font-bold text-lg flex items-center gap-2">
      <i data-lucide="key-round" class="size-5 text-primary"></i>키 발급
    </h3>
    <div class="bg-base-200 rounded-lg px-3 py-2 mt-3 text-sm">받을 팀원: <span id="member-key-issue-target" class="font-semibold">-</span></div>
    <div class="space-y-3 mt-4">
      <label class="flex flex-col gap-1 w-full">
        <span class="text-sm font-medium">브레인</span>
        <select id="member-key-brain-select" class="select w-full"></select>
      </label>
      <label class="flex flex-col gap-1 w-full">
        <span class="text-sm font-medium">키 이름</span>
        <input id="member-key-name" type="text" class="input w-full font-mono" required autocomplete="off" spellcheck="false"
               maxlength="63" pattern="[a-z0-9][a-z0-9\-]{1,62}"
               title="영어 소문자·숫자·하이픈 2~63자로 써 주세요 (예: kim-dev-passql)">
      </label>
      <div class="space-y-1">
        <div class="text-sm font-medium">권한</div>
        <label class="flex cursor-pointer items-center gap-2 py-1">
          <input type="radio" name="member-key-scope-preset" value="{{ token_page_settings.read_only_scope_preset }}" class="radio radio-sm" checked>
          <span class="text-sm">읽기 전용 (기본)</span>
        </label>
        <label class="flex cursor-pointer items-center gap-2 py-1">
          <input type="radio" name="member-key-scope-preset" value="{{ token_page_settings.read_write_scope_preset }}" class="radio radio-sm">
          <span class="text-sm">읽기 + 쓰기</span>
        </label>
      </div>
      <p id="member-key-issue-error" class="text-sm text-error" hidden></p>
    </div>
    <div class="modal-action">
      <button type="button" class="btn btn-ghost btn-sm" data-close-member-modal="member-key-issue-modal">취소</button>
      <button type="submit" id="member-key-issue-submit" class="btn btn-primary btn-sm">발급</button>
    </div>
  </form>
  <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
</dialog>

<!-- 다시 보기: 관리자 키 재확인 (입력값은 보내고 바로 비움, 결과 창은 남은 초를 보여 주고 저절로 닫힘) -->
<dialog id="member-reveal-modal" class="modal">
  <form id="member-reveal-form" class="modal-box max-w-md">
    <h3 class="font-bold text-lg flex items-center gap-2">
      <i data-lucide="eye" class="size-5 text-primary"></i>키 다시 보기
    </h3>
    <div class="bg-base-200 rounded-lg px-3 py-2 mt-3 text-sm">볼 키: <span id="member-reveal-target" class="font-mono font-semibold break-all">-</span></div>
    <label class="flex flex-col gap-1 w-full mt-4">
      <span class="text-sm font-medium">관제소 관리자 키</span>
      <input id="member-reveal-admin-key" type="password" class="input w-full font-mono" required autocomplete="off">
      <span class="text-xs opacity-60">본인 확인을 위해 한 번 더 넣어 주세요. 볼 때마다 감사 기록에 남고, 결과 창은 남은 시간을 보여 주다가 저절로 닫혀요.</span>
    </label>
    <p id="member-reveal-error" class="text-sm text-error mt-2" hidden></p>
    <div class="modal-action">
      <button type="button" class="btn btn-ghost btn-sm" data-close-member-modal="member-reveal-modal">취소</button>
      <button type="submit" id="member-reveal-submit" class="btn btn-primary btn-sm">확인하고 보기</button>
    </div>
  </form>
  <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
</dialog>

<!-- 기존 토큰 연결: 관제소 기록이 없는 살아 있는 gbrain 토큰 > 팀원 (토큰이 없으면 연결 버튼 잠금) -->
<dialog id="member-link-modal" class="modal">
  <form id="member-link-form" class="modal-box max-w-md">
    <h3 class="font-bold text-lg flex items-center gap-2">
      <i data-lucide="link" class="size-5 text-primary"></i>기존 토큰 연결
    </h3>
    <p class="text-sm mt-3">이미 쓰고 있는 토큰을 <span id="member-link-target" class="font-semibold">-</span> 팀원의 키로 기록해요.
      토큰은 그대로 살아 있고, 원문은 gbrain 에도 없어서 다시 보기는 할 수 없어요.</p>
    <div class="space-y-3 mt-4">
      <label class="flex flex-col gap-1 w-full">
        <span class="text-sm font-medium">브레인</span>
        <select id="member-link-brain-select" class="select w-full"></select>
      </label>
      <label class="flex flex-col gap-1 w-full">
        <span class="text-sm font-medium">연결할 토큰 (관제소 기록이 없는 것만 보여요)</span>
        <select id="member-link-token-select" class="select w-full font-mono"></select>
      </label>
      <p id="member-link-error" class="text-sm text-error" hidden></p>
    </div>
    <div class="modal-action">
      <button type="button" class="btn btn-ghost btn-sm" data-close-member-modal="member-link-modal">취소</button>
      <button type="submit" id="member-link-submit" class="btn btn-primary btn-sm">연결</button>
    </div>
  </form>
  <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
</dialog>
