worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log logs/access.log main;
    
    sendfile on;
    keepalive_timeout 65;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    # Upstream for Ollama
    upstream ollama_backend {
        server 127.0.0.1:11434;
    }
    
    server {
        listen 11435;
        server_name _;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, X-API-KEY, Content-Type' always;
        
        # Health check endpoint (no auth)
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"suh-ai-server","timestamp":"$time_iso8601"}';
        }
        
        # Tunnel info endpoint (no auth)
        location = /api/tunnel-info {
            default_type application/json;
            alias data/tunnel-info.json;
        }
        
        # Log endpoint (requires auth)
        location /api/logs {
            # Check if request is from local network
            set $auth_required 1;
            if ($remote_addr ~* "^(127\.|192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.)") {
                set $auth_required 0;
            }
            
            # If not local, check auth headers
            if ($auth_required = 1) {
                access_by_lua_block {
                    local auth_header = ngx.var.http_authorization
                    local api_key = ngx.var.http_x_api_key
                    
                    -- Check Bearer token
                    local valid_bearer = false
                    if auth_header then
                        local token = auth_header:match("Bearer%s+(.+)")
                        if token then
                            -- Read valid tokens from file
                            local file = io.open("config/auth_tokens.txt", "r")
                            if file then
                                for line in file:lines() do
                                    if line == token then
                                        valid_bearer = true
                                        break
                                    end
                                end
                                file:close()
                            end
                        end
                    end
                    
                    -- Check API key
                    local valid_api_key = false
                    if api_key then
                        local file = io.open("config/api_keys.txt", "r")
                        if file then
                            for line in file:lines() do
                                if line == api_key then
                                    valid_api_key = true
                                    break
                                end
                            end
                            file:close()
                        end
                    end
                    
                    if not (valid_bearer or valid_api_key) then
                        ngx.status = 401
                        ngx.say('{"error":"Unauthorized"}')
                        ngx.exit(401)
                    end
                }
            }
            
            # Serve log files
            location ~* /api/logs/(.*) {
                default_type text/plain;
                alias logs/$1;
            }
            
            # List logs
            location = /api/logs {
                default_type application/json;
                content_by_lua_block {
                    local lfs = require("lfs")
                    local json = require("cjson")
                    local logs = {}
                    
                    for file in lfs.dir("logs") do
                        if file ~= "." and file ~= ".." then
                            local attr = lfs.attributes("logs/" .. file)
                            table.insert(logs, {
                                name = file,
                                size = attr.size,
                                modified = attr.modification
                            })
                        end
                    end
                    
                    ngx.say(json.encode({logs = logs}))
                }
            }
        }
        
        # Ollama API proxy (requires auth for external)
        location / {
            # Check if request is from local network
            set $auth_required 1;
            if ($remote_addr ~* "^(127\.|192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.)") {
                set $auth_required 0;
            }
            
            # If not local, check auth headers
            if ($auth_required = 1) {
                access_by_lua_block {
                    local auth_header = ngx.var.http_authorization
                    local api_key = ngx.var.http_x_api_key
                    
                    -- Check Bearer token
                    local valid_bearer = false
                    if auth_header then
                        local token = auth_header:match("Bearer%s+(.+)")
                        if token then
                            local file = io.open("config/auth_tokens.txt", "r")
                            if file then
                                for line in file:lines() do
                                    if line == token then
                                        valid_bearer = true
                                        break
                                    end
                                end
                                file:close()
                            end
                        end
                    end
                    
                    -- Check API key
                    local valid_api_key = false
                    if api_key then
                        local file = io.open("config/api_keys.txt", "r")
                        if file then
                            for line in file:lines() do
                                if line == api_key then
                                    valid_api_key = true
                                    break
                                end
                            end
                            file:close()
                        end
                    end
                    
                    if not (valid_bearer or valid_api_key) then
                        ngx.status = 401
                        ngx.say('{"error":"Unauthorized"}')
                        ngx.exit(401)
                    end
                }
            }
            
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            
            # Proxy to Ollama
            proxy_pass http://ollama_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for long-running AI requests
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }
    }
}