[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suh-control-tower"
version = "0.1.0"
description = "Zero-dependency server-side client for the SUH control tower event intake"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/suh_control_tower"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
