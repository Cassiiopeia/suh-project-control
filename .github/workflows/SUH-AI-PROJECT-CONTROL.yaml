# ===================================================================
# SUH AI 프로젝트 자동 배포 워크플로우
# ===================================================================
#
# 이 워크플로우는 suh-ai-server 프로젝트를 Windows 서버에 자동으로 배포합니다.
#
# 주요 기능:
# - 소스 코드 체크아웃 및 Nginx 설정 파일에 API 키 주입
# - SCP를 통한 Windows 서버로 파일 업로드
# - PowerShell 스크립트를 통한 초기 배포 및 서비스 재시작
#
# 배포 프로세스:
# 1. prepare-and-upload Job:
#    - 소스 코드 가져오기
#    - Nginx 설정 파일에 API 키 주입 (secrets.OLLAMA_API_KEY_LIST)
#    - suh-ai-server 폴더를 Windows 서버(C:/AI/)로 SCP 업로드
#
# 2. deploy-and-restart Job:
#    - 초기 배포 스크립트 실행 (deploy-init.ps1)
#      * -GitHubAction 스위치 파라미터 전달: 파일이 이미 SCP로 업로드되었으므로
#        GitHub에서 다운로드하는 로직을 스킵하고 바로 배포 진행
#      * 로컬 실행 시: 파라미터 없이 실행하면 GitHub에서 자동 다운로드 수행
#    - Nginx 설정 적용 및 재시작 (deploy-nginx.ps1)
#    - Flask 서버 재시작 (deploy-flask.ps1)
#
# 트리거 조건:
# - main, deploy 브랜치에 push 시 자동 실행
# - workflow_dispatch를 통한 수동 실행
#
# 필요한 Secrets:
# - SERVER_HOST: Windows 서버 호스트 주소
# - SERVER_USER: Windows 서버 사용자명
# - SERVER_PASSWORD: Windows 서버 비밀번호
# - OLLAMA_API_KEY_LIST: Nginx 인증용 API 키 리스트 (쉼표 구분)
#
# ===================================================================

name: SUH-AI-PROJECT-CONTROL

on:
  push:
    branches: [ "main", "deploy" ]
  workflow_dispatch:

jobs:
  prepare-and-upload:
    name: 소스 준비 및 업로드
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nginx 설정 파일에 API 키 주입
        run: |
          echo "[INFO] API key list injection started..."

          # API 키 리스트 파싱 (쉼표 구분)
          IFS=',' read -ra KEYS <<< "${{ secrets.OLLAMA_API_KEY_LIST }}"

          # Nginx map 형식으로 변환
          API_KEY_MAP=""
          for key in "${KEYS[@]}"; do
            key=$(echo "$key" | xargs)  # 앞뒤 공백 제거
            if [ -n "$key" ]; then
              API_KEY_MAP="${API_KEY_MAP}\"${key}\" 1;\n        "
            fi
          done

          # 플레이스홀더를 실제 키로 치환
          sed -i "s|{{OLLAMA_API_KEY_LIST}}|${API_KEY_MAP}|g" suh-ai-server/config/nginx.conf

          echo "[SUCCESS] API key injection completed (${#KEYS[@]} keys)"

          # 검증 (민감 정보 마스킹)
          echo "[INFO] Configuration preview:"
          grep -A 5 "map \$http_x_api_key" suh-ai-server/config/nginx.conf | sed 's/"[^"]*"/"****"/g' || echo "[WARN] Preview failed (may be normal)"

      - name: Flask .env 생성 (GitHub Secret)
        run: |
          if [ -n "${{ secrets.FLASK_ENV_FILE }}" ]; then
            cat > suh-ai-server/flask/.env << 'ENV_EOF'
          ${{ secrets.FLASK_ENV_FILE }}
          ENV_EOF
            echo "[SUCCESS] flask/.env created for upload"
          else
            echo "[INFO] FLASK_ENV_FILE secret not set - skip (.env unchanged on server)"
          fi

      - name: suh-ai-server 폴더 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 2023
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "suh-ai-server"
          target: "C:/AI/"
          rm: false

  deploy-and-restart:
    name: 배포 및 서비스 재시작
    runs-on: ubuntu-latest
    needs: prepare-and-upload
    steps:
      - name: 초기 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 2023
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\AI\suh-ai-server\scripts\deploy-init.ps1" -CommitSha "${{ github.sha }}" -GitHubAction

      - name: Nginx 설정 적용 및 재시작
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 2023
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\AI\suh-ai-server\scripts\deploy-nginx.ps1"

      - name: Flask 서버 재시작
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 2023
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\AI\suh-ai-server\scripts\deploy-flask.ps1"
