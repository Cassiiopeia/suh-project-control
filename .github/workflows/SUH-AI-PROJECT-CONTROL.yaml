name: SUH-AI-PROJECT-CONTROL

on:
  push:
    branches: [ "main", "deploy" ]
  workflow_dispatch:

jobs:
  deploy-to-windows:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nginx 설정 파일에 API 키 주입
        run: |
          echo "🔑 API 키 리스트를 Nginx 설정에 주입 중..."

          # API 키 리스트 파싱 (쉼표 구분)
          IFS=',' read -ra KEYS <<< "${{ secrets.OLLAMA_API_KEY_LIST }}"

          # Nginx map 형식으로 변환
          API_KEY_MAP=""
          for key in "${KEYS[@]}"; do
            key=$(echo "$key" | xargs)  # 앞뒤 공백 제거
            if [ -n "$key" ]; then
              API_KEY_MAP="${API_KEY_MAP}\"${key}\" 1;\n        "
            fi
          done

          # 플레이스홀더를 실제 키로 치환
          sed -i "s|{{OLLAMA_API_KEY_LIST}}|${API_KEY_MAP}|g" suh-ai-server/config/nginx.conf

          echo "✅ API 키 주입 완료 (${#KEYS[@]}개)"

          # 검증 (민감 정보 마스킹)
          echo "📋 생성된 설정 미리보기:"
          grep -A 5 "map \$http_x_api_key" suh-ai-server/config/nginx.conf | sed 's/"[^"]*"/"****"/g' || echo "미리보기 실패 (정상 동작)"

      - name: suh-ai-server.zip 압축 생성 (zip 사용)
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          cd suh-ai-server
          zip -r ../suh-ai-server.zip .
          cd ..

      - name: 압축 파일을 base64로 인코딩하여 SSH로 전송
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 2023
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            # PowerShell 스크립트로 전환
            powershell -Command "
              Write-Host '📦 배포 시작...'

              # 임시 디렉토리 생성
              `$tempDir = 'C:\Temp\suh-deploy'
              if (Test-Path `$tempDir) {
                Remove-Item -Recurse -Force `$tempDir
              }
              New-Item -ItemType Directory -Path `$tempDir | Out-Null

              # GitHub Actions artifact URL에서 다운로드 (공개 커밋)
              `$repoUrl = 'https://github.com/Cassiiopeia/suh-project-control'
              `$commitSha = '${{ github.sha }}'

              Write-Host '🌐 GitHub에서 소스코드 다운로드 중...'
              `$zipUrl = \"`$repoUrl/archive/`$commitSha.zip\"
              `$zipPath = Join-Path `$tempDir 'repo.zip'

              try {
                Invoke-WebRequest -Uri `$zipUrl -OutFile `$zipPath -UseBasicParsing
                Write-Host '✅ 다운로드 완료'
              } catch {
                Write-Host '❌ 다운로드 실패:' `$_.Exception.Message
                exit 1
              }

              # 압축 해제
              Write-Host '📂 압축 해제 중...'
              Expand-Archive -Path `$zipPath -DestinationPath `$tempDir -Force

              # suh-ai-server 폴더 찾기 (압축 해제 시 폴더명이 suh-project-control-{SHA}로 생성됨)
              `$extractedFolder = Get-ChildItem -Path `$tempDir -Directory | Select-Object -First 1
              `$sourceFolder = Join-Path `$extractedFolder.FullName 'suh-ai-server'

              if (-not (Test-Path `$sourceFolder)) {
                Write-Host '❌ suh-ai-server 폴더를 찾을 수 없습니다.'
                exit 1
              }

              # 대상 폴더로 복사
              Write-Host '📋 파일 복사 중...'
              `$targetFolder = 'C:\AI\suh-ai-server'

              if (Test-Path `$targetFolder) {
                Write-Host '🗑️  기존 파일 백업 중...'
                `$backupFolder = \"`$targetFolder.backup.`$(Get-Date -Format 'yyyyMMdd-HHmmss')\"
                Copy-Item -Path `$targetFolder -Destination `$backupFolder -Recurse -Force
              }

              # 복사 (덮어쓰기)
              Copy-Item -Path \"`$sourceFolder\*\" -Destination `$targetFolder -Recurse -Force
              Write-Host '✅ 파일 배포 완료'

              # 임시 파일 정리
              Remove-Item -Recurse -Force `$tempDir
              Write-Host '🎉 배포 성공!'
            "

      - name: Nginx 설정 적용 및 재시작
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 2023
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            powershell -Command "
              Write-Host '🔍 Nginx 설치 경로 탐색 중...'

              # Nginx 경로 찾기 (Chocolatey 설치 기준)
              `$nginxPath = Get-ChildItem 'C:\tools' -Directory -Filter 'nginx-*' -ErrorAction SilentlyContinue | Where-Object { Test-Path \"`$(`$_.FullName)\nginx.exe\" } | Select-Object -First 1 -ExpandProperty FullName

              if (-not `$nginxPath) {
                Write-Host '❌ Nginx를 찾을 수 없습니다.'
                exit 1
              }

              Write-Host \"✅ Nginx 경로: `$nginxPath\"

              # 백업 생성
              `$timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'
              `$confPath = Join-Path `$nginxPath 'conf\nginx.conf'
              `$backupPath = \"`$confPath.backup.`$timestamp\"

              if (Test-Path `$confPath) {
                Copy-Item `$confPath `$backupPath -ErrorAction SilentlyContinue
                Write-Host \"💾 백업 생성: `$backupPath\"
              }

              # 새 설정 복사
              Copy-Item 'C:\AI\suh-ai-server\config\nginx.conf' `$confPath -Force
              Write-Host '📦 설정 파일 배포 완료'

              # 설정 검증
              `$nginxExe = Join-Path `$nginxPath 'nginx.exe'
              Write-Host '🔍 Nginx 설정 검증 중...'
              `$testOutput = & `$nginxExe -t 2>&1
              Write-Host `$testOutput

              if (`$LASTEXITCODE -ne 0) {
                Write-Host '❌ 설정 오류 - 롤백 중...'
                if (Test-Path `$backupPath) {
                  Copy-Item `$backupPath `$confPath -Force
                  Write-Host '✅ 이전 설정으로 롤백 완료'
                }
                exit 1
              }

              Write-Host '✅ 설정 검증 성공'

              # 무중단 재시작
              `$nginxProcess = Get-Process nginx -ErrorAction SilentlyContinue
              if (`$nginxProcess) {
                Write-Host '🔄 Nginx reload 중...'
                & `$nginxExe -s reload
                if (`$LASTEXITCODE -eq 0) {
                  Write-Host '✅ Nginx reload 완료'
                } else {
                  Write-Host '⚠️ Reload 실패 - 재시작 시도...'
                  Stop-Process -Name nginx -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2
                  Start-Process -FilePath `$nginxExe -WorkingDirectory `$nginxPath -WindowStyle Hidden
                  Write-Host '✅ Nginx 재시작 완료'
                }
              } else {
                Write-Host '🚀 Nginx 시작 중...'
                Start-Process -FilePath `$nginxExe -WorkingDirectory `$nginxPath -WindowStyle Hidden
                Write-Host '✅ Nginx 시작 완료'
              }

              Write-Host '🎉 Nginx 배포 완료!'
            "
