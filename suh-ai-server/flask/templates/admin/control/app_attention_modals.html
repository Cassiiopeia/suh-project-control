{# 앱 연동 창 3개: 소스 추가·수정 / 연결 확인 결과 / 항목 설정. control-manage-app-attention-*.js가 채움 #}

<!-- 소스 추가·수정: 칸별 오류는 data-field-error (서버 {"error":"invalid","fields":[...]}) -->
<dialog id="control-attention-source-modal" class="modal">
  <div class="modal-box max-w-xl">
    <h3 class="font-bold text-lg flex items-center gap-2">
      <i data-lucide="plug" class="size-5 text-primary"></i><span id="control-attention-source-title">소스 추가</span>
    </h3>
    <form id="control-attention-source-form" class="py-3 space-y-3" novalidate>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label class="block">
          <span class="block text-xs opacity-70 mb-1">프로젝트</span>
          <select id="control-attention-source-project" name="project_id" class="select select-sm w-full"></select>
          <span data-field-error="project_id" class="block text-xs text-error mt-1" hidden>프로젝트를 고르세요</span>
        </label>
        <label class="block">
          <span class="block text-xs opacity-70 mb-1">소스 id (소문자로 시작, 소문자·숫자 20자)</span>
          <input id="control-attention-source-id" name="source_id" type="text" maxlength="20" autocomplete="off"
                 class="input input-sm w-full font-mono" placeholder="api">
          <span data-field-error="source_id" class="block text-xs text-error mt-1" hidden>소문자로 시작하는 소문자·숫자 20자 이내</span>
        </label>
      </div>
      <label class="block">
        <span class="block text-xs opacity-70 mb-1">수집 방식</span>
        <select id="control-attention-source-mode" name="mode" class="select select-sm w-full"></select>
        <span data-field-error="mode" class="block text-xs text-error mt-1" hidden>수집 방식을 고르세요</span>
      </label>
      <label class="block">
        <span class="block text-xs opacity-70 mb-1">앱 주소 (pull, push만 쓰면 비워도 됨)</span>
        <input id="control-attention-source-url" name="url" type="text" maxlength="2048" autocomplete="off"
               class="input input-sm w-full font-mono" placeholder="https://api.example.com/internal/control/attention">
        <span data-field-error="url" class="block text-xs text-error mt-1" hidden>https 주소 (http는 내부망 IP 또는 ${ENV} 치환만)</span>
      </label>
      <div class="grid grid-cols-3 gap-2">
        <label class="block">
          <span class="block text-xs opacity-70 mb-1">주기 (초)</span>
          <input id="control-attention-source-interval" name="interval_seconds" type="number" min="60" max="3600"
                 class="input input-sm w-full" placeholder="60">
          <span data-field-error="interval_seconds" class="block text-xs text-error mt-1" hidden>60~3600</span>
        </label>
        <label class="block">
          <span class="block text-xs opacity-70 mb-1">응답 제한 (초)</span>
          <input id="control-attention-source-timeout" name="timeout_seconds" type="number" min="1" max="10"
                 class="input input-sm w-full" placeholder="5">
          <span data-field-error="timeout_seconds" class="block text-xs text-error mt-1" hidden>1~10</span>
        </label>
        <label class="block">
          <span class="block text-xs opacity-70 mb-1">끊김 판정 (초)</span>
          <input id="control-attention-source-stale" name="stale_after_seconds" type="number" min="60" max="86400"
                 class="input input-sm w-full" placeholder="주기×5">
          <span data-field-error="stale_after_seconds" class="block text-xs text-error mt-1" hidden>주기 이상 86400 이하 (push는 300 이상)</span>
        </label>
      </div>
      <label class="label cursor-pointer justify-start gap-2 text-sm">
        <input id="control-attention-source-enabled" name="is_enabled" type="checkbox" class="toggle toggle-sm toggle-success" checked>수집 사용
      </label>
      <!-- 토큰 이름·push 입구 안내 (값은 표시하지 않음) -->
      <div id="control-attention-source-help" class="rounded-box bg-base-200 p-3 text-xs space-y-1 break-all"></div>
      <p id="control-attention-source-error" class="text-xs text-error" hidden></p>
    </form>
    <div class="modal-action">
      <form method="dialog"><button class="btn btn-sm">닫기</button></form>
      <button id="control-attention-source-save" type="button" class="btn btn-primary btn-sm">
        <i data-lucide="save" class="size-4"></i>저장
      </button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- 연결 확인 결과: 상태·기준선·알림은 바꾸지 않는 미리보기 -->
<dialog id="control-attention-test-modal" class="modal">
  <div class="modal-box max-w-2xl">
    <h3 class="font-bold text-lg flex items-center gap-2">
      <i data-lucide="plug-zap" class="size-5 text-primary"></i><span id="control-attention-test-title">연결 확인</span>
    </h3>
    <p class="text-xs opacity-60 mt-1">지금 한 번 요청해 결과만 보여 줍니다. 저장된 값과 알림은 바뀌지 않습니다.</p>
    <div id="control-attention-test-body" class="py-3 space-y-3 text-sm">
      <div class="opacity-60">확인 중</div>
    </div>
    <div class="modal-action">
      <form method="dialog"><button class="btn btn-sm">닫기</button></form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- 항목 설정: 앱 값(회색) 옆에 관제소 덮어쓰기, 줄마다 저장 -->
<dialog id="control-attention-items-modal" class="modal">
  <!-- 칸 9개라 기본 최대 폭보다 넓게 (좁은 화면은 표 가로 스크롤) -->
  <div class="modal-box max-w-6xl" style="max-width: min(96vw, 84rem);">
    <h3 class="font-bold text-lg flex items-center gap-2">
      <i data-lucide="list-checks" class="size-5 text-primary"></i><span id="control-attention-items-title">항목 설정</span>
    </h3>
    <p class="text-xs opacity-60 mt-1">비워 두면 앱 값과 기본 규칙을 씁니다. 기본 규칙: count는 늘면, gauge는 기준 넘으면, state는 상태 바뀌면.</p>
    <div class="overflow-x-auto py-3">
      <table class="table table-sm">
        <thead><tr><th>항목</th><th>앱 값</th><th>표시</th><th>이름</th><th>수준 정책</th><th>알림 규칙</th><th>기준값</th><th>채널</th><th></th></tr></thead>
        <tbody id="control-attention-items-body"><tr><td colspan="9" class="opacity-60">불러오는 중</td></tr></tbody>
      </table>
    </div>
    <div class="modal-action">
      <form method="dialog"><button class="btn btn-sm">닫기</button></form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
