worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Map hash configuration for long API keys
    map_hash_bucket_size 128;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=python_limit:10m rate=100r/s;

    # API Key validation map (GitHub Actions will inject keys here)
    map $http_x_api_key $api_key_valid {
        default 0;
        {{OLLAMA_API_KEY_LIST}}
    }

    # Public endpoints that don't require authentication
    map $request_uri $is_public_endpoint {
        default 0;
        ~^/health$ 1;
        ~^/api/flask/docs/swagger 1;
    }

    # Upstream for Ollama
    upstream ollama_backend {
        server 127.0.0.1:11434;
    }

    # Upstream for Python Flask Server
    upstream python_backend {
        server 127.0.0.1:5000;
    }

    server {
        listen 0.0.0.0:11435;
        server_name _;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, X-API-Key, Content-Type' always;

        # Flask API routing (MUST be before location /)
        location /api/flask/ {
            # Authentication decision logic
            set $auth_ok 0;

            # Public endpoints bypass authentication
            if ($is_public_endpoint = 1) {
                set $auth_ok 1;
            }

            # Valid API key grants access
            if ($api_key_valid = 1) {
                set $auth_ok 1;
            }

            # Reject unauthorized requests
            if ($auth_ok = 0) {
                return 401 '{"error":"Unauthorized - Valid X-API-Key header required"}';
            }

            # Rate limiting for Flask (higher limit)
            limit_req zone=python_limit burst=200 nodelay;

            # URL rewrite: /api/flask/xxx -> /xxx
            rewrite ^/api/flask/(.*)$ /$1 break;

            # Proxy to Python Flask backend
            proxy_pass http://python_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/flask;

            # Timeouts for Flask requests
            proxy_read_timeout 180s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
        }

        # All requests go through authentication check
        location / {
            # Authentication decision logic
            set $auth_ok 0;

            # Public endpoints bypass authentication
            if ($is_public_endpoint = 1) {
                set $auth_ok 1;
            }

            # Valid API key grants access
            if ($api_key_valid = 1) {
                set $auth_ok 1;
            }

            # Reject unauthorized requests
            if ($auth_ok = 0) {
                return 401 '{"error":"Unauthorized - Valid X-API-Key header required"}';
            }

            # Rate limiting for authenticated requests
            limit_req zone=api_limit burst=20 nodelay;

            # Proxy to Ollama backend
            proxy_pass http://ollama_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running AI requests
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }
    }
}
